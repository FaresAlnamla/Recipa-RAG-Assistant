services:
  # Backend API
  - type: webService
    name: recipa-backend
    runtime: python-3.12
    plan: free
    buildCommand: |
      cd backend && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OPENAI_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://recipaai.vercel.app
      - key: VECTORSTORE_DIR
        value: ./vectorstore/chroma
# Database (PostgreSQL) - optional, currently using SQLite
# databases:
#   - name: recipa-db
#     databaseName: recipa
#     user: recipa_user
